<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish — Hilol Nashr</title>
<link rel="icon" type="image/png" href="/static/mark.png">
<script>
// Sahifa chizilishidan oldin mavzuni qo'llaymiz (miltillamasligi uchun)
(function(){var t="system";try{t=localStorage.getItem("theme")||"system"}catch(e){}
var dark=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=dark?"dark":"light";document.documentElement.dataset.themeChoice=t})();
</script>
<style>
:root[data-theme=dark] body{background:#0F1512;color:#E7EEE9}
:root[data-theme=dark] form{background:#171E1A;border-color:#26302A;box-shadow:none}
:root[data-theme=dark] .sub{color:#9BA8A0}
:root[data-theme=dark] input{background:#171E1A;border-color:#3A463F;color:#E7EEE9}
:root[data-theme=dark] button{background:#238551}
:root[data-theme=dark] .err{background:#2E1715;border-color:#5E2A25;color:#F0857A}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6F5;color:#14201A;font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:#fff;border:1px solid #E2E7E4;border-radius:16px;padding:32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 30px rgba(20,32,26,.06)}
img{height:56px;width:auto;align-self:flex-start}
h1{margin:0;font-size:20px}.sub{margin:-10px 0 0;color:#5A665F}
label{font-weight:600;display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;min-height:44px;border:1px solid #C7CFCA;border-radius:10px;padding:0 12px;font:inherit}
input:focus{border-color:#1B7F4B;outline:2px solid #E7F5EC}
button{min-height:46px;border:0;border-radius:10px;background:#1B7F4B;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#14633A}
.err{margin:0;color:#B42318;background:#FEF0EE;border:1px solid #F3C1BA;border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<form method="post" action="/login">
<img src="/static/logo.png" alt="Hilol Nashr">
<h1>Kanallar markazi</h1>
<p class="sub">Filial Telegram kanallarini boshqarish paneli</p>
{% if error %}<p class="err" role="alert">Login yoki parol noto'g'ri.</p>{% endif %}
<div><label for="u">Login</label><input id="u" name="username" autocomplete="username" required></div>
<div><label for="p">Parol</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
<button type="submit">Kirish</button>
</form>
</body>
</html>
